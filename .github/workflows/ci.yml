name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            nuget.config
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Kompaz.sln --configfile nuget.config

      - name: Build
        run: dotnet build Kompaz.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Kompaz.sln --configuration Release --no-build
